  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #120020;
      color: #eee;
    }

    header {
      padding: 2rem;
      text-align: center;
      background: #2d004d;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    header h1 {
      font-size: 2.5rem;
      color: #a259ff;
    }

    header p {
      font-size: 1.2rem;
    }

    .navbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      background-color: #1a0033;
      padding: 0.5rem;
      gap: 1rem;
    }

    .navbar a {
      color: #caaaff;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .navbar a:hover {
      background-color: #3d0066;
    }

    #searchBar {
      display: block;
      margin: 1rem auto;
      padding: 0.5rem;
      width: 80%;
      max-width: 600px;
      border: none;
      border-radius: 5px;
      background: #220040;
      color: white;
    }

    .browser-container {
      text-align: center;
      padding: 1rem;
    }

    iframe {
      border: 3px solid #4d0080;
      border-radius: 8px;
    }

    .game-request-container {
      background: #1a002d;
      margin: 2rem auto;
      padding: 2rem;
      width: 90%;
      max-width: 700px;
      border-radius: 10px;
      box-shadow: 0 0 20px #4b0082;
    }

    .game-request-container h2 {
      color: #d7aaff;
    }

    .game-request-container input,
    .game-request-container textarea,
    .game-request-container button {
      display: block;
      width: 100%;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
      padding: 0.5rem;
      border: none;
      border-radius: 5px;
      background: #2e004d;
      color: white;
    }

    .game-request-container button {
      background: #8000ff;
      cursor: pointer;
      transition: background 0.3s;
    }

    .game-request-container button:hover {
      background: #aa00ff;
    }

    .games-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      padding: 2rem;
    }

    .game {
      background: #2a004a;
      padding: 1rem;
      border-radius: 10px;
      text-align: center;
      transition: transform 0.2s, background 0.3s;
    }

    .game a {
      color: #d7b3ff;
      text-decoration: none;
      font-weight: bold;
    }

    .game:hover {
      transform: scale(1.05);
      background: #3d0066;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #2d004d;
      color: #caaaff;
      font-size: 0.9rem;
    }
  </style>
